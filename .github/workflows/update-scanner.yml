name: Update Scanner
on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create docs dir
        run: mkdir -p docs
      - name: Run scanner
        run: python scanner.py
      - name: Commit results
        run: |
          git config user.email "action@github.com"
          git config user.name "Scanner Bot"
          git add docs/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update scan data $(date -u +%Y-%m-%d)"
          git push
